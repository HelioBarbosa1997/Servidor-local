#schema/servico.yaml

components:
  schemas:
    servico:
      properties:
      id:
        type: intenger
        example: 1
      nome:
        type: string
        example: "Serviço de Limpeza"
      descricao:
        type: string
        example: "Serviço de limpeza profissional para residencias"
      categoria:
        type: string
        example: "Limpeza"
      enabled:
        type: boolean
        example: true
      created_at:
        type: string
        example: "2022-01-01T00:00:00.000Z"  
      updated_at:
        type: string
        example: "2022-01-01T00:00:00.000Z"

    #schema para criar um novo serviço
    CreateService:
      type: object
      properties:
        nome:
          type: object
          example: Serviço de limpeza
        descricao:
          type: string
          example: Serviço de limpreza para residfencias e empresa
        categoria:
          type: string
          example: limpeza
        enabled:
          type: boolean
          example: true

    #schema para buscar servico detalhado
    ServicoDetalhado:
      type: object
      properties:
        id:
          type: intenger
          example: 1
        nome:
          type: string
          example: "Serviço de limpreza"
        descricao:
          type: string
          example: "Serviço de limpreza proficional para residencias e empresas"
        designacao_categoria:
          type: string
          example: "Limpeza"
        id_epmresa:
          type: integer
          example: 1
        designacao_empresa:
          type: string
          example: " Empresa de limpesa"
        icone_empresa:
          type: string
          example: ""
        enabled:
          type: boolean
          example: true

    #schema generico para sucesso
    ResponseSucess:
      type: object
      properties:
        message:
          type: string
          example: "Serviço criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          type: object
          $ref: "#components/schemas/Servico"
    

    #shema generico de resposta a erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Error ao buscar serviços"
        status:
          type: boolean
          example: false
        data:
          type: object
          properties:
            null
    