components:
  schemas:
    Proposta:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_prestacao_servico:
          type: integer
          example: 5
        preco_hora:
          type: number
          format: float
          example: 15.5
        horas_estimadas:
          type: number
          format: float
          example: 8
        estado:
          type: string
          example: "pendente"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"

    # Schema para criar proposta
    CreateProposta:
      type: object
      properties:
        id_prestacao_servico:
          type: integer
          example: 5
        preco_hora:
          type: number
          format: float
          example: 20
        horas_estimadas:
          type: number
          format: float
          example: 10
        estado:
          type: string
          example: "pendente"
        enabled:
          type: boolean
          example: true

    # Schema genérico de sucesso
    ResponseSucess:
      type: object
      properties:
        message:
          type: string
          example: "Operação realizada com sucesso"
        status:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Proposta"

    # Schema genérico de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro ao processar proposta"
        status:
          type: boolean
          example: false
        data:
          nullable: true
          example: null

  #projecto final

    PropostaAceite:
      type: object
      description: Representa uma proposta que foi aceite
      properties:
        id:
          type: integer
          description: ID da proposta
          example: 10
        id_prestacao_servico:
          type: integer
          description: ID da prestação de serviço associada
          example: 5
        estado:
          type: string
          description: Estado atual da proposta
          enum:
            - Pendente
            - Aceite
            - Rejeitada
          example: Aceite
        data_aceite:
          type: string
          format: date-time
          description: Data em que a proposta foi aceite
          example: "2026-04-04T15:30:00Z"
        mensagem:
          type: string
          description: Mensagem de confirmação
          example: "Proposta aceite com sucesso"

    # Response de sucesso
    successResponse:
      type: object
      description: Resposta retornada quando a proposta é aceite com sucesso
      properties:
        status:
          type: string
          description: Status da operação
          example: success
        mensagem:
          type: string
          description: Mensagem de confirmação
          example: Proposta aceite com sucesso
        proposta:
          $ref: '#/components/schemas/PropostaAceite'

    # Response de erro
    ErrorResponse:
      type: object
      description: Proposta nao aceite
      properties:
        status:
          type: string
          description: Status da operação
          example: error
        mensagem:
          type: string
          description: Erro ao fazer Proposta
          example: Proposta não encontrada ou já aceite