components:
  schemas:
    PrestadorServico:
      type: object
      properties:
        id:
          type: integer
          example: 1
        idPrestador:
          type: integer
          example: 10
        idServico:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2026-04-07T12:00:00Z"

    CreatePrestadorServico:
      type: object
      required:
        - idPrestador
        - idServico
      properties:
        idPrestador:
          type: integer
          example: 10
        idServico:
          type: integer
          example: 5
    
    PrestacaoServicoByCategoria:
    type: object
    properties:
      id_prestacao_servico:
        type: string
        example: "123"

      descricao:
        type: string
        example: "Reparação de computadores"

      data_pedido:
        type: string
        example: "2026-04-16T10:00:00.000Z"

      id_servico:
        type: string
        example: "123"

      nome_servico:
        type: string
        example: "Informática"

      categoria_nome:
        type: string
        example: "Tecnologia"

      categoria_icone:
        type: string
        example: ""

    ResponseSucess:
      type: object
      properties:
        message:
          type: string
          example: "Operação realizada com sucesso"

    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro: registro não encontrado"
        code:
          type: integer
          example: 404

  
