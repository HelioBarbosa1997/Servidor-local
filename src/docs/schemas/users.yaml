#schemas/users.yaml

  components:
    schemas:
      Users:
        type: object
        properties:
          id:
            type: string
            example: 1
          nome:
            type: string
            example: "Helio Barbosa"
          numero_identificação:
            type: string
            example: "M001S"
          data_nascimento:
            type: string
            example: "22-03-1997"
          email:
            type: string
            example: "barbosahifb1997@gmail.com"
          telefone:
            type: string
            example: "9867602"
          pais:
            type: string
            example: "Cabo Verde"
          localidade:
            type: string
            example: "Ponta D agua"
          password:
            type: string
            example: "12345678"
          enabled:
            type: boolean
            example: true
          created_at: 
            type: string
            example: "2022-01-01T00:00:00.000Z"
          updated_at:
            type: string
            example: "2022-01-01T00:00:00.000Z"
      
    # schema para criar um novo utilizador
      CreateUser:
        type: object
        properties:
          nome:
            type: string
            example: "Helio Barbosa"
          numero_identificacao:
            type: string
            example: "M001S"
          data_nascimento:
            type: string
            example: "22-03-1997"
          email:
            type: string
            example: "barbosahifb1997@gmail.com"
          telefone:
            type: string
            example: "9867602"
          pais:
            type: string
            example: "Cabo Verde"
          localidade:
            type: string
            example: "Ponta D agua"
          password:
            type: string
            example: "12345678"
          enabled:
            type: boolean
            example: true

      LoginUser:
        type: object
        properties:
          email:
            type: string
            example: "user@example.com"
          password:
            type: string
            example: "senha123"

      UpdatePassword:
        type: object
        required:
          - oldPassword
          - newPassword
        properties:
          oldPassword:
            type: string
            format: password
          newPassword:
            type: string
            format: password
      
      ResetPasswordById:
        type: object
        required:
          - id
          - newPassword
        properties:
          id:
            type: string
            example: "1"
            description: "ID do usuário cuja senha será redefinida"
          newPassword:
            type: string
            format: password
            example: "novaSenha123"
            description: "Nova senha do usuário"
      
        # Schema genérico de resposta de sucesso
      ResponseSucess:
        type: object
        properties:
          message:
            type: string
            example: "Usuário criado com sucesso"
          status:
            type: boolean
            example: true
          data:
            type: object
            $ref: "#/components/schemas/CreateUser"

      # Schema genérico de resposta de erro
      ResponseError:
        type: object
        properties:
          message:
            type: string
            example: "Erro ao processar usuário"
          status:
            type: boolean
            example: false
          data:
            nullable: true
            example: null

      

