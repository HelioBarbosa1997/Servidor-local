components:
  schemas:
    Orcamento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        total:
          type: number
          format: float
          example: 350.75
        id_utilizadores:
          type: integer
          example: 10
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"

    CreateOrcamento:
      type: object
      required:
        - total
        - id_utilizadores
      properties:
        total:
          type: number
          format: float
          example: 400
        id_utilizadores:
          type: integer
          example: 10
        enabled:
          type: boolean
          example: true

    ResponseSuccess:        
      type: object
      properties:
        message:
          type: string
          example: "Orçamento criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Orcamento"

    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro ao processar orçamento"
        status:
          type: boolean
          example: false
        data:
          type: object         
          nullable: true
          example: null

    OrcamentoCalculoResponse:
      type: object
      description: Resultado do cálculo do orçamento
      properties:
        id:
          type: integer
          example: 1
        id_prestador:
          type: integer
          example: 1
        taxa_urgencia:
          type: number
          format: float
          example: 10
        subtotal:
          type: number
          format: float
          example: 200
        total:
          type: number
          format: float
          example: 220
        servicos:
          type: array
          description: Lista de serviços do orçamento com total individual
          items:
            $ref: '#/components/schemas/ServicoCalculoResponse'

    ServicoCalculoResponse:
      type: object
      required:
        - preco_hora
        - horas_estimadas
        - total
      properties:
        id_servico:              
          type: integer
          example: 5
        nome:                   
          type: string
          example: "Instalação elétrica"
        preco_hora:
          type: number
          format: float
          example: 50
        horas_estimadas:
          type: number
          format: float
          example: 4
        total:
          type: number
          format: float
          example: 200