components:
  schemas:
    Categoria:
      type: object
      properties:
        id:
          type: string
          example: 1
        designacao:
          type: string
          example: "Furtado Barbosa filial" 
        icone: 
          type: string
          example: ""
        created_at:
          type: string
          example: "2022-01-01T00:00:00.000Z"
        updated_at:
          type: string
          example: "2022-01-01T00:00:00.000Z"
    CreateEmpresa:
      type: object
      properties:
        designacao:
        type: string
        example: "Furtado Barbosa filial" 
      icone: 
        type: string
        example: ""
    ResponseSucess:
      type: object
      properties:
        message:
          type: string
          example: "Categoria criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          type: object
          $ref: "#components/schemas/Categoria"
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro ao criar categoria"
        status:
          type: boolean
          example: false
  

