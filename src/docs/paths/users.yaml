paths:
  /user:
    get:
      summary: Listar todos os usuários
      tags:
        - Usuarios
      description: Retorna uma lista de todos os usuários disponíveis
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Nenhum usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    post:
      summary: Criar um novo usuário
      tags:
        - Usuarios 
      description: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/{id}:
    get:
      summary: Buscar usuário por ID
      tags:
        - Usuarios
      description: Retorna um usuário específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    put:
      summary: Atualizar usuário
      tags:
        - Usuarios
      description: Atualiza um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    delete:
      summary: Apagar usuário
      tags:
        - Usuarios
      description: Remove um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário apagado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"