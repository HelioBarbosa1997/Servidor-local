paths:
  /user:
    get:
      summary: Listar todos os usuários
      tags:
        - Usuarios
      description: Retorna uma lista de todos os usuários disponíveis
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Nenhum usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  /user/create:
    post:
      summary: Criar um novo usuário
      tags:
        - Usuarios 
      description: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/getById/{id}:
    get:
      summary: Buscar usuário por ID
      tags:
        - Usuarios
      description: Retorna um usuário específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/update/{id}:
    put:
      summary: Atualizar usuário
      tags:
        - Usuarios
      description: Atualiza um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/delete/{id}:
    delete:
      summary: Apagar usuário
      tags:
        - Usuarios
      description: Remove um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário apagado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        
  /user/login:
    post:
      summary: Login de um Usuarios
      tags:
        - Usuarios
      description: Faz login dos usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUser"
      responses:
        "200":
          description: Usuario encontrado 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: Erro ao logar utilizador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /auth/update-password:
    put:
      summary: Atualizar password
      tags:
        - Usuarios
      description: Requer autenticação e validação da password atual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePassword"
      responses:
        "200":
          description: Password atualizada com sucesso
        "401":
          description: Password atual incorreta

  /auth/reset-password:
    put:
      summary: Resetar password
      tags:
        - Usuarios
      description: Redefine a password usando token de recuperação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties: 
                token:
                  type: string
                  example: "abc123token"
                newPassword:
                  type: string
                  example: "novaSenha123"
      responses:
        "200":
          description: Password redefinida com sucesso
        "400":
          description: Token inválido ou expirado