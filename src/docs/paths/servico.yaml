#paths/servico.yaml

paths:
  /service:
    get:
      summary: Listar todos os serviços
      tags:
        - Serviços
      description: Retorna uma lista de todos os serviços disponiveis
      responses:
        "200":
          description: Lista de serviços
          content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Servico"
        "400":
          description: "Nenhum serviço encontrado"
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

    
  /service/create:
    post:
      summary: Criar um novo serviço
      tags:
        - Serviços
      description: Criar um novo serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
            type: object
            $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "400":
        description:
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/ResponseError"

  /service/get-by-id/{id}:
    get:
      summary: Buscar um serviço por id
      tags:
        - Serviços
      description: Retoma um serviço específico pelo id
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Serviço encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"

        "404":
          description: Serviço nao encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /service/update/{id}:
    put:
      summary: Atualizar um serviço
      tags:
        - Serviços
      description: Atualiar um serviço especifico pelo id
      parameters:
        - name: id
          in: path
          required: true
          description: ID de serviço a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object    
              $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço atualizado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schemas:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Serviço nao encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"

  /service/delete/{id}:
    delete:
      summary: Apagar um serviço
      tags:
        - Serviços
      description: Apagar um serviço especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Serviço apagado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Serviço nao encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
      
  \service/all-detailed:
    get:
      summary: Listar todos os servicos detalhados
      tags:
        - service
      description: Retorna uma lista de todos os servicos disponiveis com detalhes
      parameters:
        - name: limit
          in: query
          required: false
          description: Limite de servicos a serem retomados
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          description: offset de servicos a serem retomados
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: Lista de servicos detalhados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicoDetalhado"
        "404":
          description: Nenhum servico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"