paths:
  /Categoria:
    get:
      summary: Listar todos as categorias
      tags:
        - Categoria
      description: Retorna uma lista de todos as categorias disponíveis
      responses:
        "200":
          description: Lista de categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
        "400":
          description: "Nenhuma categoria encontrado"
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
  /Categoria/create:
    post:
      summary: Criar uma nova categoria
      tags:
        - Categoria
      description: Criar uma nova categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateEmpresa"
      responses:
        "200":
          description: Categoria criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSuccess" 
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
  /Categoria/get-by-id/{id}:
    get:
      summary: Buscar um categoria por id
      tags:
        - Categoria
      description: Retorna um categoria específico pelo id
      parameters:
        - name: id
          in: path
          required: true
          description: ID da categoria
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Categoria encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Categoria não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
  /Categoria/update/{id}:
    put:
      summary: Atualizar uma categoria
      tags:
        - Categoria
      description: Atualiza uma categoria específico pelo id
      parameters:
        - name: id
          in: path
          required: true
          description: ID da categoria a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/CreateCategoria"
      responses:
        "200":
          description: Categoria atualizado atualizado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Categoria não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"
  /Categoria/delete/{id}:
    delete:
      summary: Apagar uma categoria
      tags:
        - Categoria
      description: Apagar um categoria específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do categoria a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Categoria apagado cpm sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Categoria não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"  
