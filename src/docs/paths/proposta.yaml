paths:
  /proposta:
    get:
      summary: Listar todas as propostas
      tags:
        - Proposta
      description: Retorna uma lista de todas as propostas disponíveis
      responses:
        "200":
          description: Lista de propostas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposta"
        "400":
          description: Nenhuma proposta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  proposta/create:
    post:
      summary: Criar uma nova proposta
      tags:
        - Proposta
      description: Cria uma nova proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/getById{id}:
    get:
      summary: Buscar proposta por ID
      tags:
        - Proposta
      description: Retorna uma proposta específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Proposta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  proposta/update/{id}:
    put:
      summary: Atualizar proposta
      tags:
        - Proposta
      description: Atualiza uma proposta pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  proposta/delete/{id}:
    delete:
      summary: Apagar proposta
      tags:
        - Proposta
      description: Remove uma proposta pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Proposta apagada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  #Projecto final
  /propostas/{id}/aceitar:
    put:
      summary: Aceitar uma proposta
      tags:
        - Proposta
      description: |
        Permite ao dono do orçamento aceitar uma proposta.
        
        Ao aceitar:
        - A proposta fica com estado "Aceite"
        - As restantes propostas do mesmo serviço ficam "Rejeitadas"
        - A prestação de serviço associada é atualizada
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta a ser aceite
          schema:
            type: integer
            example: 10
      responses:
        "200":
          description: Proposta aceite com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Proposta aceite com sucesso
        "400":
          description: Erro ao aceitar proposta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Proposta não encontrada
        "401":
          description: Não autorizado
        "404":
          description: Proposta não encontrada